name: Verify Control Tower
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m tower.demo
      - run: git diff --exit-code -- evidence/demo.json site/index.html
      - run: python -m tower.load --output /tmp/control-tower-load.json
      - uses: actions/upload-artifact@v4
        with:
          name: load-evidence-${{ matrix.python }}
          path: /tmp/control-tower-load.json
          retention-days: 30
